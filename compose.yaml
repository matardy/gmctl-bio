# Local Postgres for development and DB tests.
# Production uses Neon (same Postgres major version).
#   npm run db:up       -> start and wait until healthy
#   npm run db:migrate  -> apply db/migrations
services:
  db:
    image: postgres:17-alpine
    container_name: personal-web-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_web
    ports:
      # 5432 is often taken by other local stacks; keep this one on 5433.
      - "5433:5432"
    volumes:
      - personal-web-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_web"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  personal-web-db:
